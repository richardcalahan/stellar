<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stellar" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Stellar Playground</title>
  </head>
  <body>
    <!-- Layer 1: the world, drawn by the GPU through three.js -->
    <canvas id="webgl"></canvas>
    <!-- Layer 2: text and thin geometry (labels, rings, toasts) on a 2D canvas -->
    <canvas id="hud"></canvas>
    <!-- Layer 3: real buttons and cards that need real hit targets -->
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
